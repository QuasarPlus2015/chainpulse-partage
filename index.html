<style>

  .rv-kpi.lim, .rv-kpi.amber { border-color:var(--amber); background:var(--amber-soft); } .rv-kpi.lim .rv-num, .rv-kpi.amber .rv-num { color:var(--amber); }

  .rv-kpi.late { border-color:color-mix(in srgb, #7b5ea7 45%, var(--surface)); background:color-mix(in srgb, #7b5ea7 12%, var(--surface)); } .rv-kpi.late .rv-num { color:#9378c4; } .rv-kpi.late .rv-gauge i { background:#7b5ea7; }

  .rv-badge.free { background:var(--surface-2); color:var(--ink-soft); } .rv-badge.over { background:var(--danger); color:#fff; }

  .rv-thr { display:inline-flex; align-items:center; gap:5px; margin-top:4px; font-size:.68rem; color:var(--ink-faint); }

  .rv-thr button { width:17px; height:17px; padding:0; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font:700 .8rem/1 var(--font-body); cursor:pointer; }

  .rv-cell.l1, .rv-l1 { background:color-mix(in srgb, var(--accent-2) 24%, var(--surface)); } .rv-cell.l1 { color:var(--accent-2); }

  .rv-stats { display:flex; flex-direction:column; gap:1px; padding:0 8px; font-size:.74rem; color:var(--ink-soft); } .rv-stats strong { color:var(--ink); font-family:var(--font-mono); }
  .rv-detail, .rv-unlist { border-top:1px dashed var(--border); background:var(--surface-2); padding:6px 0 10px; }
  .rv-act { padding:5px 0; }
  .rv-act-label { padding:0 8px 0 52px; font-size:.8rem; font-weight:600; line-height:1.25; cursor:pointer; } .rv-act-label:hover { color:var(--accent-2); }
  .rv-act-label small { display:block; font-weight:400; color:var(--ink-faint); font-size:.7rem; }

  .rv-unrow { background:repeating-linear-gradient(45deg,var(--surface) 0 8px,var(--surface-2) 8px 16px); }
  .rv-unmid { margin:0 8px; font-size:.84rem; color:var(--ink-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .rv-unact { grid-template-columns:250px 1fr 190px; } .rv-unmeta { margin:0 8px; font-size:.72rem; color:var(--ink-soft); font-weight:600; }
  .rv-more { margin:4px 8px 0 52px; font-size:.78rem; color:var(--ink-soft); } .rv-more a { color:var(--accent-2); font-weight:700; cursor:pointer; }

  .view-tabs { display: flex; gap: 4px; margin: -6px 0 18px; border-bottom: 1px solid var(--border); }

<script>
const SUPABASE_URL = 'https://dvveswkpyxqscyozzaqg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CJI_sDeM9vKW0HG-TzfePg_fhEdnwn1';
const TERM_LABELS = { court: 'Court terme', moyen: 'Moyen terme', long: 'Long terme' };
const STATUS_LABELS = { a_demarrer: 'À démarrer', en_cours: 'En cours', termine: 'Terminée', abandonne: 'Abandonnée', non_retenu: 'Non retenue par le client' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseYmd(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
// Affichage des dates à la française (JJ/MM/AAAA) plutôt que le format ISO brut (AAAA-MM-JJ).
function fmtDateFr(s) { const d = parseYmd(s); return d ? d.toLocaleDateString('fr-FR', { timeZone: 'UTC' }) : ''; }

let DATA = null;
const state = { term: null, zoom: 'month', pillarOpen: {}, view: 'gantt', resOpen: {}, resUnOpen: false, resUnAll: false };
const VIEW_LABELS = { gantt: 'Vue Gantt', resources: 'Vue Ressources' };

async function main() {
  const app = document.getElementById('app');
  const token = new URLSearchParams(location.search).get('token');
  if (!token) { app.innerHTML = '<div class="state-msg">Lien invalide : aucun jeton de partage fourni.</div>'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_gantt`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if (!res.ok) {
      const txt = await res.text();
      if (txt.includes('invalid_or_revoked_link')) {
        app.innerHTML = '<div class="state-msg">Ce lien de partage n\'est plus valide : il a peut-être été révoqué. Merci de demander un nouveau lien.</div>';
      } else {
        app.innerHTML = '<div class="state-msg">Impossible de charger ce plan de progrès pour le moment. Merci de réessayer plus tard.</div>';
      }
      return;
    }
    DATA = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="state-msg">Impossible de contacter le serveur. Vérifiez votre connexion et réessayez.</div>';
    return;
  }
  render();
}

function pillarName(id) { return (DATA.pillars.find(p => p.id === id) || {}).name || ''; }
function subprocessName(id) { return (DATA.subprocesses.find(s => s.id === id) || {}).name || ''; }

function isOverdue(a) {
  const today = new Date().toISOString().slice(0, 10);
  return !!(a.due_date && a.status !== 'termine' && a.status !== 'abandonne' && a.status !== 'non_retenu' && a.due_date < today);
}

function ganttDateRange() {
  const dated = DATA.actions.filter(a => a.start_date || a.due_date);
  if (!dated.length) return null;
  let min = null, max = null;
  dated.forEach(a => {
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!min || s < min) min = s;
    if (!max || d > max) max = d;
  });
  const start = new Date(Date.UTC(min.getUTCFullYear(), min.getUTCMonth(), 1));
  const end = new Date(Date.UTC(max.getUTCFullYear(), max.getUTCMonth() + 1, 0));
  return { start, end };
}
function ganttDateToPct(d, range) { return Math.max(0, Math.min(100, (d - range.start) / (range.end - range.start) * 100)); }
const GANTT_MONTH_NAMES = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
function ganttAxisBoundaries(range, zoom) {
  const b = []; let cur = new Date(range.start);
  const step = zoom === 'quarter' ? 3 : zoom === 'week' ? null : 1;
  if (zoom === 'week') {
    cur = new Date(range.start);
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(cur.getTime() + 7 * 86400000); }
    b.push(new Date(range.end.getTime() + 86400000));
  } else {
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + step, 1)); }
    b.push(cur);
  }
  return b;
}
function ganttSegmentLabel(b, zoom) {
  if (zoom === 'quarter') return `T${Math.floor(b.getUTCMonth() / 3) + 1} ${b.getUTCFullYear()}`;
  if (zoom === 'week') return `${String(b.getUTCDate()).padStart(2, '0')}/${String(b.getUTCMonth() + 1).padStart(2, '0')}`;
  return GANTT_MONTH_NAMES[b.getUTCMonth()];
}

function pillarStats(items) {
  let totalDays = 0, hasDated = false, minStart = null, maxEnd = null, lateCount = 0;
  items.forEach(a => {
    if (isOverdue(a)) lateCount++;
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!s || !d) return;
    hasDated = true;
    if (!minStart || s < minStart) minStart = s;
    if (!maxEnd || d > maxEnd) maxEnd = d;
    if (a.status === 'termine' || a.status === 'abandonne' || a.status === 'non_retenu') return;
    totalDays += Math.max(1, Math.round((d - s) / 86400000) + 1);
  });
  const avgPct = items.length ? Math.round(items.reduce((sum, a) => sum + (a.progress_pct != null ? a.progress_pct : 0), 0) / items.length) : 0;
  const allDone = items.length > 0 && items.every(a => a.status === 'termine');
  return { totalDays: hasDated ? totalDays : null, avgPct, minStart, maxEnd, lateCount, allDone };
}

function openActionModal(a) {
  const pName = pillarName(a.pillar_id);
  const spName = a.subprocess_id != null ? subprocessName(a.subprocess_id) : '';
  const statusColor = a.status === 'termine' ? 'var(--good)' : a.status === 'abandonne' || a.status === 'non_retenu' ? 'var(--ink-faint)' : 'var(--accent)';
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal" style="position:relative;">
      <button type="button" class="close-btn" id="am-close">✕</button>
      <div class="breadcrumb">${esc(pName)}${spName ? ' · ' + esc(spName) : ''}</div>
      <h3>${esc(a.title)}</h3>
      <div class="field"><label>Statut</label><div class="val"><span class="status-badge" style="background:${statusColor};color:#1a1a1a;">${esc(STATUS_LABELS[a.status] || a.status)}</span></div></div>
      ${a.description ? `<div class="field"><label>Description</label><div class="val">${esc(a.description)}</div></div>` : ''}
      <div class="field"><label>Terme</label><div class="val">${esc(TERM_LABELS[a.term] || a.term)}</div></div>
      <div class="field"><label>Dates</label><div class="val">${a.start_date ? 'Début : ' + fmtDateFr(a.start_date) : ''}${a.start_date && a.due_date ? ' — ' : ''}${a.due_date ? 'Échéance : ' + fmtDateFr(a.due_date) : ''}${!a.start_date && !a.due_date ? 'Non définies' : ''}</div></div>
      <div class="field"><label>% avancement</label><div class="val">${a.progress_pct != null ? a.progress_pct : 0}%</div></div>
      ${a.responsible_label ? `<div class="field"><label>Responsable</label><div class="val">${esc(a.responsible_label)}</div></div>` : ''}
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  wrap.querySelector('#am-close').onclick = () => wrap.remove();
}

function toolbarHtml(termFilter, zoom, globalStats) {
  return `
    <div class="toolbar">
      <div class="term-chips">
        <div class="term-chip ${!termFilter ? 'active' : ''}" data-term="">Tous</div>
        <div class="term-chip ${termFilter === 'court' ? 'active' : ''}" data-term="court"><span class="term-dot term-dot-court"></span>Court terme</div>
        <div class="term-chip ${termFilter === 'moyen' ? 'active' : ''}" data-term="moyen"><span class="term-dot term-dot-moyen"></span>Moyen terme</div>
        <div class="term-chip ${termFilter === 'long' ? 'active' : ''}" data-term="long"><span class="term-dot term-dot-long"></span>Long terme</div>
        <div class="global-stats">
          <span>Durée des actions restantes : <strong>${globalStats.totalDays != null ? globalStats.totalDays + ' j' : '—'}</strong></span>
          <span>Avancement moyen : <strong>${globalStats.avgPct}%</strong></span>
          <span>Actions en retard : <strong>${globalStats.lateCount}</strong></span>
        </div>
      </div>
      <div class="zoom-control">
        ${['quarter', 'month', 'week'].map(z => `<button type="button" class="zoom-btn ${zoom === z ? 'active' : ''}" data-zoom="${z}">${z === 'quarter' ? 'Trimestre' : z === 'month' ? 'Mois' : 'Semaine'}</button>`).join('')}
      </div>
    </div>`;
}

function tabsHtml() {
  const views = (DATA.views && DATA.views.length) ? DATA.views : ['gantt'];
  if (views.length < 2) return '';
  return `<div class="view-tabs">${['gantt', 'resources'].filter(v => views.includes(v)).map(v => `<button type="button" class="view-tab ${state.view === v ? 'active' : ''}" data-view="${v}">${VIEW_LABELS[v]}</button>`).join('')}</div>`;
}

function attachCommon(app) {
  app.querySelectorAll('[data-view]').forEach(el => el.onclick = () => { state.view = el.dataset.view; render(); });
  app.querySelectorAll('[data-term]').forEach(el => el.onclick = () => { state.term = el.dataset.term || null; render(); });
  app.querySelectorAll('[data-zoom]').forEach(el => el.onclick = () => { state.zoom = el.dataset.zoom; render(); });
  app.querySelectorAll('[data-action-id]').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const a = DATA.actions.find(x => String(x.id) === el.dataset.actionId);
    if (a) openActionModal(a);
  });
}

function renderGantt() {
  const app = document.getElementById('app');
  const termFilter = state.term;
  const visible = DATA.actions.filter(a => !termFilter || a.term === termFilter);
  const dated = visible.filter(a => a.start_date || a.due_date);
  const undated = visible.filter(a => !a.start_date && !a.due_date);
  const range = ganttDateRange();
  const zoom = state.zoom;

  const byPillar = new Map();
  dated.forEach(a => { if (!byPillar.has(a.pillar_id)) byPillar.set(a.pillar_id, []); byPillar.get(a.pillar_id).push(a); });
  const sortKey = (a) => { const d = parseYmd(a.start_date) || parseYmd(a.due_date); return d ? d.getTime() : Infinity; };
  const pillarBlocks = DATA.pillars.filter(p => byPillar.has(p.id)).map(p => ({ pillar: p, items: byPillar.get(p.id).slice().sort((x, y) => sortKey(x) - sortKey(y)) }));

  let gridCss = 'none', axisHtml = '';
  if (range) {
    const boundaries = ganttAxisBoundaries(range, zoom);
    const segments = [];
    for (let i = 0; i < boundaries.length - 1; i++) {
      const segStart = boundaries[i] < range.start ? range.start : boundaries[i];
      const segEnd = boundaries[i + 1] > range.end ? range.end : boundaries[i + 1];
      segments.push({ boundary: boundaries[i], widthPct: Math.max(0, (segEnd - segStart) / (range.end - range.start) * 100) });
    }
    const stops = []; let acc = 0;
    segments.forEach(s => { stops.push(`var(--border) ${acc}%`, `var(--border) calc(${acc}% + 1px)`, `transparent calc(${acc}% + 1px)`); acc += s.widthPct; });
    gridCss = `linear-gradient(to right, ${stops.join(',')})`;
    axisHtml = segments.map(s => `<div style="width:${s.widthPct}%;">${esc(ganttSegmentLabel(s.boundary, zoom))}</div>`).join('');
  }

  const globalStats = pillarStats(dated);

  const pillarBlocksHtml = pillarBlocks.length ? pillarBlocks.map(({ pillar, items }) => {
    const { totalDays, avgPct, minStart, maxEnd, lateCount, allDone } = pillarStats(items);
    const isOpen = state.pillarOpen[pillar.id] !== false;
    let barHtml = '';
    if (minStart && maxEnd && range) {
      let leftPct = ganttDateToPct(minStart, range), rightPct = ganttDateToPct(maxEnd, range);
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      barHtml = `<div class="pillar-bar" style="left:${leftPct}%;width:${Math.max(0, Math.min(100 - leftPct, rightPct - leftPct))}%;"></div>`;
    }
    const rowsHtml = isOpen ? items.map(a => {
      const overdue = isOverdue(a);
      const color = a.term === 'court' ? 'var(--danger)' : a.term === 'moyen' ? 'var(--amber)' : 'var(--good)';
      const s = parseYmd(a.start_date) || parseYmd(a.due_date), d = parseYmd(a.due_date) || parseYmd(a.start_date);
      let leftPct = range ? ganttDateToPct(s, range) : 0, rightPct = range ? ganttDateToPct(d, range) : 0;
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      const widthPct = Math.max(0, Math.min(100 - leftPct, rightPct - leftPct));
      const muted = a.status === 'abandonne' || a.status === 'non_retenu';
      const barStyle = muted ? `left:${leftPct}%;width:${widthPct}%;` : `left:${leftPct}%;width:${widthPct}%;background:${color};opacity:${a.status === 'termine' ? 0.5 : 1};`;
      return `<div class="row" data-action-id="${a.id}">
        <div class="row-label">
          <div class="row-title">${esc(a.title)}${overdue ? ' ⚠' : ''}</div>
          <div class="row-sub">${a.subprocess_id != null ? esc(subprocessName(a.subprocess_id)) : ''}</div>
          ${a.responsible_label ? `<div class="row-resp">${esc(a.responsible_label)}</div>` : ''}
        </div>
        <div class="row-track" style="background-image:${gridCss};"><div class="bar ${muted ? 'bar-muted' : ''}" style="${barStyle}"></div></div>
        <div class="pct-cell" style="color:${muted ? 'var(--ink-faint)' : color};">${a.progress_pct != null ? a.progress_pct : 0}%</div>
      </div>`;
    }).join('') : '';
    return `
    <div class="pillar-header ${isOpen ? 'open' : ''}${allDone ? ' done' : ''}" data-pillar-id="${pillar.id}">
      <div class="pillar-left">
        <span class="pillar-name">${esc(pillar.name)}</span>
        <span class="pillar-count">${items.length} action${items.length > 1 ? 's' : ''}</span>
        ${allDone ? '<span class="pillar-done-badge">✓ Pilier terminé</span>' : ''}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="pillar-track" style="background-image:${gridCss};">${barHtml}</div>
      <div class="pillar-stats">
        <div>Durée des actions restantes : <strong>${totalDays != null ? totalDays + ' j' : '—'}</strong></div>
        <div>Avancement moyen : <strong>${avgPct}%</strong></div>
        <div class="${lateCount > 0 ? 'stat-late' : ''}">Actions en retard : <strong>${lateCount}</strong></div>
      </div>
    </div>
    ${rowsHtml}`;
  }).join('') : `<div class="empty-note">Aucune action datée${termFilter ? ' pour ce terme' : ''}.</div>`;

  const undatedHtml = undated.length ? `<div class="empty-note">${undated.length} action${undated.length > 1 ? 's' : ''} sans échéance définie (non représentée${undated.length > 1 ? 's' : ''} sur la frise).</div>` : '';

  app.innerHTML = `
    ${headerHtml()}
    ${tabsHtml()}
    ${toolbarHtml(termFilter, zoom, globalStats)}
    <div class="card">
      ${range ? `<div class="axis"><div class="axis-spacer"></div><div class="axis-track">${axisHtml}</div><div class="axis-pct">Avancement</div></div>` : ''}
      ${pillarBlocksHtml}
    </div>
    ${undatedHtml}
    <div class="footer-note">Vue en lecture seule — généré par ChainPulse.</div>
  `;

  attachCommon(app);
  app.querySelectorAll('[data-pillar-id]').forEach(el => el.onclick = () => {
    const pid = el.dataset.pillarId;
    state.pillarOpen[pid] = state.pillarOpen[pid] === false ? true : false;
    render();
  });
}

const RV_INACTIVE = ['termine', 'abandonne', 'non_retenu'];
const RV_DEFAULT_THR = 3;

// Responsable d'une action : interviewé(e) (clé = id) ou nom libre regroupé
// par nom exact (clé = n:nom en minuscules). null = sans responsable.
function rvResolve(a) {
  if (!a.resp_key) return null;
  return { key: a.resp_key, name: a.responsible_label, sub: a.resp_free ? 'Nom saisi librement (sans fiche)' : (a.resp_sub || ''), free: !!a.resp_free };
}
function ymdOf(d) { return d.toISOString().slice(0, 10); }
function rvPeriods(range, zoom) {
  const b = ganttAxisBoundaries(range, zoom);
  const out = [];
  for (let i = 0; i < b.length - 1; i++) out.push({ s: b[i], e: new Date(b[i + 1].getTime() - 86400000), label: ganttSegmentLabel(b[i], zoom) });
  return out;
}
function rvLevel(n, t) { return n > t ? 'l4' : (n === t && n > 0) ? 'l3' : n >= 2 ? 'l2' : n === 1 ? 'l1' : ''; }
function rvActionDates(a) {
  const s = parseYmd(a.start_date) || parseYmd(a.due_date);
  const d = parseYmd(a.due_date) || parseYmd(a.start_date);
  return s && d ? { s, d } : null;
}

function buildResourcesHtml() {
  const thrOf = (key) => (DATA.thresholds && DATA.thresholds[key]) || RV_DEFAULT_THR;
  const termFilter = state.term;
  const zoom = state.zoom || 'month';
  const visible = DATA.actions.filter(a => !termFilter || a.term === termFilter);
  const range = ganttDateRange();
  const P = range ? rvPeriods(range, zoom) : [];
  const n = P.length;
  const today = new Date();
  const todayUtc = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const overlap = (a, b, c, d) => a <= d && c <= b;
  // Action "en retard" : échéance dépassée et encore active (même règle que le ⚠ du Gantt).
  const todayStr = ymdOf(todayUtc);
  const isLateA = (a) => !!(a.due_date && a.due_date < todayStr && RV_INACTIVE.indexOf(a.status) < 0);
  const lateDaysA = (a) => Math.round((todayUtc - parseYmd(a.due_date)) / 86400000);
  // Fin "effective" pour la charge : une action en retard est considérée comme
  // encore à faire jusqu'à aujourd'hui (la barre est prolongée en violet).
  const effEnd = (a, dd) => (isLateA(a) && todayUtc > dd.d) ? todayUtc : dd.d;
  const pillarName = (id) => (DATA.pillars.find(p => p.id === id) || {}).name || '';

  const groups = new Map();
  const unassigned = [];
  visible.forEach(a => {
    const r = rvResolve(a);
    const active = RV_INACTIVE.indexOf(a.status) < 0;
    if (!r) { if (active) unassigned.push(a); return; }
    if (!groups.has(r.key)) groups.set(r.key, { ...r, all: [], active: [] });
    const g = groups.get(r.key);
    g.all.push(a);
    if (active) g.active.push(a);
  });
  const resList = [...groups.values()].filter(g => g.active.length).sort((x, y) => x.name.localeCompare(y.name));
  resList.forEach(r => {
    r.thr = thrOf(r.key);
    r.dated = r.active.filter(rvActionDates).sort((x, y) => rvActionDates(x).s - rvActionDates(y).s);
    r.undated = r.active.filter(a => !rvActionDates(a));
    r.loads = P.map(p => r.dated.filter(a => { const dd = rvActionDates(a); return overlap(dd.s, effEnd(a, dd), p.s, p.e); }).length);
    r.loadsLate = P.map(p => r.dated.filter(a => isLateA(a) && overlap(new Date(parseYmd(a.due_date).getTime() + 86400000), todayUtc, p.s, p.e)).length);
    r.nLate = r.dated.filter(isLateA).length;
    r.peak = r.loads.length ? Math.max(...r.loads) : 0;
    r.cum = r.dated.reduce((sum, a) => { const dd = rvActionDates(a); return sum + Math.max(1, Math.round((dd.d - dd.s) / 86400000) + 1); }, 0);
    r.avg = r.all.length ? Math.round(r.all.reduce((sum, a) => sum + (a.progress_pct != null ? a.progress_pct : 0), 0) / r.all.length) : 0;
  });
  // Totaux globaux (mêmes règles que le Gantt : actions datées visibles)
  const gDated = visible.filter(rvActionDates);
  const gDatedActive = gDated.filter(a => RV_INACTIVE.indexOf(a.status) < 0);
  const gCum = gDated.length ? gDatedActive.reduce((sum, a) => { const dd = rvActionDates(a); return sum + Math.max(1, Math.round((dd.d - dd.s) / 86400000) + 1); }, 0) : null;
  const gAvg = gDated.length ? Math.round(gDated.reduce((sum, a) => sum + (a.progress_pct != null ? a.progress_pct : 0), 0) / gDated.length) : 0;
  const gLate = gDated.filter(isLateA).length;
  const assignedActive = resList.reduce((s, r) => s + r.active.length, 0);
  const unCount = unassigned.length;
  const total = assignedActive + unCount;

  // Cartes de synthèse
  const gauge = (v, den, cls) => { const p = den ? 100 * v / den : 0; return `<div class="rv-gauge"><i class="${cls || ''}" style="width:${Math.max(4, p)}%;">${Math.round(p)} %</i></div>`; };
  const ranked = resList.slice().sort((a, b) => (b.peak / b.thr - a.peak / a.thr) || (b.peak - a.peak));
  const best = ranked[0];
  let peakCard;
  if (best) {
    const others = resList.filter(r => r.peak >= r.thr && r !== best).length;
    const state_ = best.peak > best.thr ? 'warn' : best.peak === best.thr ? 'lim' : '';
    const sc = Math.max(best.peak, best.thr) * 1.25;
    peakCard = `<div class="rv-kpi ${state_}"><div class="rv-top"><div class="rv-num">${best.peak}</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span></div><div class="rv-lbl">Actions en même temps, au maximum sur une même semaine — ${esc(best.name)}</div>
      <div class="rv-gauge"><i style="width:${Math.max(4, 100 * best.peak / sc)}%;">${Math.round(100 * best.peak / best.thr)} %</i><b class="rv-tick" style="left:${100 * best.thr / sc}%;"></b></div>
      <div class="rv-cap">${best.peak} action${best.peak > 1 ? 's' : ''} pour un seuil de ${best.thr}${best.peak >= best.thr && others ? ` · +${others} autre${others > 1 ? 's' : ''} personne${others > 1 ? 's' : ''} en alerte` : ''}</div></div>`;
  } else {
    peakCard = `<div class="rv-kpi"><div class="rv-top"><div class="rv-num">0</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span></div><div class="rv-lbl">Actions en même temps, au maximum sur une même semaine</div><div class="rv-gauge"><i style="width:4%;">0 %</i></div><div class="rv-cap">Aucune action assignée</div></div>`;
  }
  const nOver = resList.filter(r => r.peak > r.thr), nLim = resList.filter(r => r.peak === r.thr), nOk = resList.filter(r => r.peak < r.thr);
  const segHtml = [['s-over', 'en surcharge', nOver], ['s-lim', 'au seuil', nLim], ['', 'dans la limite', nOk]]
    .map(([c, l, m]) => m.length ? `<span class="${c}" style="flex:${m.length};" title="${esc(l + ' : ' + m.map(x => x.name).join(', '))}">${m.length}</span>` : '').join('');
  const kpisHtml = `
    <div class="rv-kpis">
      <div class="rv-kpi"><div class="rv-top"><div class="rv-num">${resList.length}</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span></div><div class="rv-lbl">Ressources mobilisées</div><div class="rv-seg">${segHtml || '<span style="background:var(--surface-2);color:var(--ink-faint);">0</span>'}</div><div class="rv-cap">${nOver.length} en surcharge · ${nLim.length} au seuil · ${nOk.length} dans la limite</div></div>
      <div class="rv-kpi"><div class="rv-top"><div class="rv-num">${assignedActive}</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg></span></div><div class="rv-lbl">Actions assignées (actives)</div>${gauge(assignedActive, total)}<div class="rv-cap">${assignedActive} sur ${total} actions actives</div></div>
      ${peakCard}
      <div class="rv-kpi ${gLate ? 'late' : ''}"><div class="rv-top"><div class="rv-num">${gLate}</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></svg></span></div><div class="rv-lbl">Actions en retard</div>${gauge(gLate, gDatedActive.length)}<div class="rv-cap">${gLate} sur ${gDatedActive.length} action${gDatedActive.length > 1 ? 's' : ''} datée${gDatedActive.length > 1 ? 's' : ''} (actives)</div></div>
      <div class="rv-kpi ${unCount ? 'amber' : ''}"><div class="rv-top"><div class="rv-num">${unCount}</div><span class="rv-kico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/></svg></span></div><div class="rv-lbl">Actions sans responsable</div>${gauge(unCount, total)}<div class="rv-cap">${unCount} sur ${total} actions actives</div></div>
    </div>`;

  // En-tête du calendrier
  const hdrGroups = [];
  P.forEach(p => {
    const key = zoom === 'week' ? GANTT_MONTH_NAMES[p.s.getUTCMonth()] : String(p.s.getUTCFullYear());
    const last = hdrGroups[hdrGroups.length - 1];
    if (last && last.k === key) last.c++; else hdrGroups.push({ k: key, c: 1 });
  });
  const headHtml = n ? `
    <div class="rv-weeks rv-month-row" style="grid-template-columns:${hdrGroups.map(x => x.c + 'fr').join(' ')};">${hdrGroups.map(x => `<div>${esc(x.k)}</div>`).join('')}</div>
    <div class="rv-weeks rv-week-row" style="--n:${n};">${P.map(p => `<div class="${overlap(p.s, p.e, todayUtc, todayUtc) ? 'now' : ''}" title="${ymdOf(p.s)} → ${ymdOf(p.e)}">${esc(p.label)}</div>`).join('')}</div>` : '';

  const fmtDm = (d) => `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
  const termColor = (t) => t === 'court' ? 'var(--danger)' : t === 'moyen' ? 'var(--amber)' : 'var(--good)';
  const isOpenRow = (k) => !!(state.resOpen && state.resOpen[k]);
  const cellFont = n > 40 ? 'font-size:0;' : n > 22 ? 'font-size:.6rem;' : '';

  let rowsHtml = resList.map(r => {
    const open = isOpenRow(r.key);
    const initials = r.name.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
    let html = `
    <div class="rv-row ${open ? 'open' : ''}" data-rv-row="${esc(r.key)}">
      <div class="rv-id"><div class="rv-avatar ${r.free ? 'free' : ''}">${esc(initials)}</div>
        <div style="min-width:0;"><div class="rv-name">${esc(r.name)}${r.free ? '<span class="rv-badge free">Nom libre</span>' : ''}${r.peak > r.thr ? '<span class="rv-badge over">Surcharge</span>' : ''}</div>
          <div class="rv-sub">${esc(r.sub)}</div>
          <div class="rv-thr ${r.thr !== RV_DEFAULT_THR ? 'custom' : ''}" title="Seuil d'alerte pour cette ressource">Seuil <b>${r.thr}</b></div></div>
        <svg class="rv-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="rv-weeks" style="--n:${n};${cellFont}">${P.map((p, i) => `<div class="rv-cell ${rvLevel(r.loads[i], r.thr)} ${overlap(p.s, p.e, todayUtc, todayUtc) ? 'today' : ''}" title="${esc(r.name)} · ${ymdOf(p.s)} → ${ymdOf(p.e)} : ${r.loads[i]} action(s) active(s)${r.loadsLate[i] ? ' dont ' + r.loadsLate[i] + ' en retard' : ''}">${r.loads[i] || ''}${r.loadsLate[i] ? '<svg class="rv-ltri" viewBox="0 0 24 24" width="13" height="13"><path d="M12 2.5 22.5 21h-21z" fill="#111" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 9v5.5M12 17.4v.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>' : ''}</div>`).join('')}</div>
      <div class="rv-stats"><div><strong>${r.active.length}</strong> action${r.active.length > 1 ? 's' : ''} active${r.active.length > 1 ? 's' : ''}${r.undated.length ? ` <span style="color:var(--amber)">(dont ${r.undated.length} sans date)</span>` : ''}</div><div><strong>${r.cum} j</strong> cumulés · pic <strong>${r.peak}</strong></div><div>Avancement moyen <strong>${r.avg}%</strong></div>${r.nLate ? `<div class="rv-late">⚠ <strong style="color:var(--danger);">${r.nLate}</strong> en retard</div>` : ''}</div>
    </div>`;
    if (open) {
      html += `<div class="rv-detail">` + r.dated.map(a => {
        const dd = rvActionDates(a);
        let i0 = P.findIndex(p => overlap(p.s, p.e, dd.s, dd.s)), i1 = P.findIndex(p => overlap(p.s, p.e, dd.d, dd.d));
        if (i0 < 0) i0 = 0; if (i1 < 0) i1 = n - 1;
        const days = Math.max(1, Math.round((dd.d - dd.s) / 86400000) + 1);
        const late = isLateA(a);
        let iT = P.findIndex(p => overlap(p.s, p.e, todayUtc, todayUtc)); if (iT < 0 && n && todayUtc > P[n - 1].e) iT = n - 1;
        const ext = late && iT > i1 ? `<div class="rv-act-bar rv-late-ext" data-action-id="${a.id}" style="grid-row:1;grid-column:${i1 + 2} / ${iT + 2};" title="Prolongation : action en retard, comptée comme encore à faire jusqu'à aujourd'hui"></div>` : '';
        return `<div class="rv-act">
          <div class="rv-act-label" data-action-id="${a.id}" title="Ouvrir la fiche">${esc(a.title)}<small>${fmtDm(dd.s)} → ${fmtDm(dd.d)} · ${days} j${late ? ` · <span class="rv-late-t">⚠ en retard de ${lateDaysA(a)} j</span>` : ''}</small></div>
          <div class="rv-act-track" style="--n:${n};"><div class="rv-act-bar" data-action-id="${a.id}" style="grid-row:1;grid-column:${i0 + 1} / ${i1 + 2};background:${termColor(a.term)};"></div>${ext}</div>
          <div class="rv-act-pct">${a.progress_pct != null ? a.progress_pct : 0} %</div></div>`;
      }).join('') + r.undated.map(a => `<div class="rv-act">
          <div class="rv-act-label" data-action-id="${a.id}" title="Ouvrir la fiche">${esc(a.title)}<small style="color:var(--amber);">sans date</small></div><div></div>
          <div class="rv-act-pct">${a.progress_pct != null ? a.progress_pct : 0} %</div></div>`).join('') + `</div>`;
    }
    return html;
  }).join('');

  // Ligne "Non assigné"
  const unOpen = !!state.resUnOpen;
  rowsHtml += `
    <div class="rv-row rv-unrow ${unOpen ? 'open' : ''}" data-rv-toggle-un>
      <div class="rv-id"><div class="rv-avatar none">?</div><div><div class="rv-name">Non assigné</div><div class="rv-sub">Travail à répartir</div></div></div>
      <div class="rv-unmid"><span>Ces actions n'ont pas de responsable : elles ne sont pas comptées dans la charge.</span><button type="button" class="rv-assign" data-rv-toggle-un>Voir la liste</button></div>
      <div class="rv-stats"><div><strong>${unCount}</strong> action${unCount > 1 ? 's' : ''}</div><div style="color:var(--amber)">${unassigned.filter(a => !rvActionDates(a)).length} sans date</div></div>
    </div>`;
  if (unOpen) {
    const shown = state.resUnAll ? unassigned : unassigned.slice(0, 8);
    rowsHtml += `<div class="rv-unlist">` + (shown.length ? shown.map(a => {
      const dd = rvActionDates(a);
      return `<div class="rv-act rv-unact"><div class="rv-act-label" data-action-id="${a.id}" title="Ouvrir la fiche">${esc(a.title)}<small>${esc(pillarName(a.pillar_id))}</small></div>
        <div class="rv-unmeta">${dd ? `${fmtDm(dd.s)} → ${fmtDm(dd.d)}` : '<span style="color:var(--amber);">sans date</span>'}</div>
        <div class="rv-act-pct"></div></div>`;
    }).join('') : `<div class="rv-more">Toutes les actions actives ont un responsable.</div>`) +
      (unassigned.length > 8 ? `<div class="rv-more"><a data-rv-un-all>${state.resUnAll ? 'Réduire la liste' : `Afficher les ${unassigned.length - 8} autres actions sans responsable`}</a></div>` : '') + `</div>`;
  }

  const legend = `
    <div class="rv-legend">
      <span><b>Charge</b> = nombre d'actions actives sur la période :</span>
      <span><i class="sw" style="background:var(--surface-2)"></i>0</span>
      <span><i class="sw rv-l1"></i>1</span>
      <span><i class="sw rv-l2"></i>2 et +</span>
      <span><i class="sw rv-l3"></i>seuil atteint</span>
      <span><i class="sw rv-l4"></i>au-dessus du seuil (surcharge)</span>
      <span><i class="sw rv-ext"></i>prolongation d'une action en retard (comptée jusqu'à aujourd'hui)</span>
      <span><span style="display:inline-block;vertical-align:-2px;margin-right:5px;line-height:0;"><svg style="position:static" viewBox="0 0 24 24" width="13" height="13"><path d="M12 2.5 22.5 21h-21z" fill="#111" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 9v5.5M12 17.4v.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></span>case incluant des actions en retard</span>
      <span style="margin-left:auto;">Seuil par défaut : <b>${RV_DEFAULT_THR} actions simultanées</b>, fixé par ressource par l\'auditeur</span>
    </div>`;

  return `
    ${toolbarHtml(termFilter, zoom, { totalDays: gCum, avgPct: gAvg, lateCount: gLate })}
    ${kpisHtml}
    <div class="rv-card">
      <div class="rv-grid-head"><div></div><div>${headHtml}</div><div class="rv-col-title">Synthèse</div></div>
      ${resList.length ? '' : `<div class="empty-note" style="padding:14px 8px;">Aucune action active n'est encore assignée à une personne${termFilter ? ' pour ce terme' : ''}.</div>`}
      ${rowsHtml}
      ${legend}
    </div>`;
}


function renderResources() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${headerHtml()}
    ${tabsHtml()}
    ${buildResourcesHtml()}
    <div class="footer-note">Vue en lecture seule — généré par ChainPulse.</div>
  `;
  attachCommon(app);
  app.querySelectorAll('[data-rv-row]').forEach(el => el.onclick = () => { state.resOpen[el.dataset.rvRow] = !state.resOpen[el.dataset.rvRow]; render(); });
  app.querySelectorAll('[data-rv-toggle-un]').forEach(el => el.onclick = (e) => { e.stopPropagation(); state.resUnOpen = !state.resUnOpen; render(); });
  app.querySelectorAll('[data-rv-un-all]').forEach(el => el.onclick = (e) => { e.stopPropagation(); state.resUnAll = !state.resUnAll; render(); });
}

function render() {
  const views = (DATA.views && DATA.views.length) ? DATA.views : ['gantt'];
  if (!views.includes(state.view)) state.view = views[0];
  if (state.view === 'resources') renderResources(); else renderGantt();
}

main();
</script>
</body>
</html>
