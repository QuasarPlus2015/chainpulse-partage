<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ChainPulse — Audit Score by QUASAR+ — Plan de progrès (partage)</title>
<style>
  :root {
    --bg: #1a1a1a; --surface: #232323; --surface-2: #2a2a2a; --border: #3a3a3a;
    --ink: #f2f2f2; --ink-soft: #c7c7c7; --ink-faint: #8d8d8d;
    --accent: #d61313; --danger: #e05656; --amber: #e0a040; --good: #4dbd74;
    --danger-soft: #3a1414; --amber-soft: #3a2a10; --good-soft: #10301c;
    --accent-2: #6ca3d6; --accent-2-soft: #1c2c3a; --orange: #f0975a; --font-body: 'Source Sans Pro', Arial, sans-serif;
    --font: 'Source Sans Pro', Arial, sans-serif; --font-display: 'Raleway', Arial, sans-serif; --font-mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; row-gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
  header.top .brand-group { display: flex; align-items: center; gap: 10px; }
  header.top .brand-q { width: 44px; height: 44px; flex-shrink: 0; color: #fff; }
  header.top .brand-q svg { width: 100%; height: 100%; display: block; }
  header.top .brand-word { display: flex; flex-direction: column; line-height: 1.15; }
  header.top .brand-word strong { font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; letter-spacing: 0.2px; color: var(--ink); }
  header.top .brand-word span { font-size: 0.64rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  header.top .brand-view { margin-left: 14px; padding-left: 14px; border-left: 1px solid var(--border); font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--accent); }
  header.top .brand-mark { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid var(--accent); box-shadow: 0 0 0 2px rgba(214,19,19,0.14); }
  header.top .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--accent); }
  header.top .meta { text-align: right; }
  header.top .meta .company { font-size: 1.1rem; font-weight: 700; }
  header.top .meta .audit { font-size: 0.85rem; color: var(--ink-faint); }
  .state-msg { padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 0.95rem; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .term-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .term-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-soft); font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .term-chip.active { background: var(--surface-2); color: var(--ink); border-color: var(--ink-faint); }
  .term-dot { width: 9px; height: 9px; border-radius: 50%; }
  .term-dot-court { background: var(--danger); } .term-dot-moyen { background: var(--amber); } .term-dot-long { background: var(--good); }
  .global-stats { display: flex; align-items: center; gap: 16px; padding-left: 14px; border-left: 1px solid var(--border); font-size: 0.78rem; color: var(--ink-soft); }
  .global-stats strong { color: var(--ink); font-family: var(--font-mono); }
  .zoom-control { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .zoom-btn { padding: 6px 14px; font-size: 0.75rem; font-weight: 700; background: none; border: none; border-right: 1px solid var(--border); color: var(--ink-soft); cursor: pointer; }
  .zoom-btn:last-child { border-right: none; }
  .zoom-btn.active { background: var(--surface-2); color: var(--ink); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .axis { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .axis-spacer { width: 260px; flex-shrink: 0; }
  .axis-track { flex: 1; display: flex; }
  .axis-track > div { text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--ink-faint); padding: 8px 0; box-sizing: border-box; white-space: nowrap; overflow: hidden; }
  .axis-pct { width: 90px; flex-shrink: 0; text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--ink-faint); padding: 8px 0; }
  .pillar-header { display: flex; align-items: center; background: var(--surface-2); margin-top: 10px; padding: 8px 0; cursor: pointer; }
  .pillar-header.done { background: var(--good-soft); }
  .pillar-left { width: 260px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .pillar-name { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .pillar-count { font-size: 0.72rem; color: var(--ink-faint); }
  .pillar-done-badge { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--good); color: var(--surface); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; }
  .chev { margin-left: auto; width: 14px; height: 14px; color: var(--ink-faint); transition: transform .15s; }
  .pillar-header.open .chev { transform: rotate(180deg); }
  .pillar-track { flex: 1; position: relative; margin: 0 2px; height: 10px; border-radius: 4px; overflow: hidden; }
  .pillar-bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-faint); opacity: .5; }
  .pillar-stats { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 14px; font-size: 0.72rem; color: var(--ink-soft); }
  .pillar-stats strong { color: var(--ink); font-family: var(--font-mono); }
  .stat-late strong { color: var(--danger); }
  .row { display: flex; align-items: center; min-height: 54px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: var(--surface-2); }
  .row-label { width: 260px; flex-shrink: 0; padding: 8px 12px; }
  .row-title { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
  .row-sub { font-size: 0.7rem; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-resp { font-size: 0.7rem; color: #fff; font-weight: 600; margin-top: 2px; }
  .row-track { flex: 1; position: relative; height: 10px; margin: 0 2px; }
  .bar { position: absolute; top: 0; height: 10px; border-radius: 4px; }
  .bar-muted { background: repeating-linear-gradient(45deg, var(--surface-2) 0, var(--surface-2) 4px, var(--border) 4px, var(--border) 8px); }
  .pct-cell { width: 90px; flex-shrink: 0; text-align: center; font-size: 0.78rem; font-family: var(--font-mono); font-weight: 700; }
  .empty-note { padding: 20px; color: var(--ink-faint); font-size: 0.85rem; text-align: center; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .modal .breadcrumb { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; }
  .modal .field { margin-bottom: 12px; }
  .modal .field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); margin-bottom: 3px; }
  .modal .field .val { font-size: 0.88rem; }
  .modal .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 1.1rem; }
  .status-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .footer-note { margin-top: 30px; text-align: center; font-size: 0.72rem; color: var(--ink-faint); }
  .rv-kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
  .rv-kpi { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .rv-num { font:800 1.9rem var(--font-display); line-height:1; }
  .rv-lbl { font-size:.8rem; color:var(--ink-soft); margin-top:4px; min-height:3.9em; }
  .rv-lbl .rv-assign { margin-top:6px; }
  .rv-kpi.warn { border-color:var(--danger); background:var(--danger-soft); } .rv-kpi.warn .rv-num { color:var(--danger); }
  .rv-kpi.lim, .rv-kpi.amber { border-color:var(--amber); background:var(--amber-soft); } .rv-kpi.lim .rv-num, .rv-kpi.amber .rv-num { color:var(--amber); }
  .rv-assign { border:0; background:var(--accent-2); color:#fff; border-radius:999px; font:700 .74rem var(--font-body); padding:5px 12px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .rv-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rv-kico { width:34px; height:34px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent-2); background:color-mix(in srgb, currentColor 14%, transparent); }
  .rv-kpi.warn .rv-kico { color:var(--danger); } .rv-kpi.lim .rv-kico, .rv-kpi.amber .rv-kico { color:var(--amber); } .rv-kpi.late .rv-kico { color:#7b5ea7; }
  .rv-kpi.late { border-color:color-mix(in srgb, #7b5ea7 45%, var(--surface)); background:color-mix(in srgb, #7b5ea7 12%, var(--surface)); } .rv-kpi.late .rv-num { color:#9378c4; } .rv-kpi.late .rv-gauge i { background:#7b5ea7; }
  .rv-ltri { position:absolute; top:2px; right:2px; }
  .rv-late-ext, .rv-ext { background:repeating-linear-gradient(45deg,#7b5ea7 0 4px,#b19cd9 4px 8px); }
  .rv-late-t, .rv-late { color:var(--danger); font-weight:700; }
  .rv-gauge { position:relative; margin-top:10px; height:18px; background:rgba(128,128,128,.22); border-radius:999px; overflow:hidden; }
  .rv-gauge i { display:flex; align-items:center; height:100%; min-width:40px; border-radius:999px; background:var(--accent-2); color:#fff; font:800 .68rem var(--font-mono); padding-left:9px; box-sizing:border-box; font-style:normal; }
  .rv-kpi.warn .rv-gauge i { background:var(--danger); } .rv-kpi.lim .rv-gauge i, .rv-kpi.amber .rv-gauge i { background:var(--amber); }
  .rv-tick { position:absolute; top:0; bottom:0; width:2px; background:var(--ink); z-index:2; }
  .rv-seg { display:flex; gap:3px; margin-top:10px; height:18px; }
  .rv-seg span { flex:1; min-width:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font:800 .64rem var(--font-mono); color:#fff; background:var(--accent-2); }
  .rv-seg span.s-over { background:var(--danger); } .rv-seg span.s-lim { background:var(--orange); }
  .rv-cap { font-size:.72rem; color:var(--ink-soft); margin-top:4px; }
  .rv-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px 16px; }
  .rv-grid-head, .rv-row, .rv-act { display:grid; grid-template-columns:250px 1fr 190px; align-items:center; }
  .rv-weeks { display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:3px; margin:0 8px; }
  .rv-month-row, .rv-week-row { font-size:.68rem; font-weight:700; color:var(--ink-faint); text-align:center; text-transform:uppercase; letter-spacing:.03em; }
  .rv-month-row > div { border-bottom:1px solid var(--border); padding-bottom:3px; }
  .rv-week-row > div { padding:4px 0 6px; } .rv-week-row .now { color:var(--accent-2); }
  .rv-col-title { font-size:.7rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; text-align:center; }
  .rv-row { padding:8px 0; border-top:1px solid var(--border); cursor:pointer; } .rv-row:hover { background:color-mix(in srgb, var(--surface-2) 40%, var(--surface)); }
  .rv-id { display:flex; align-items:center; gap:10px; padding:0 8px; min-width:0; }
  .rv-avatar { width:34px; height:34px; border-radius:50%; background:var(--accent-2-soft); color:var(--accent-2); font:800 .8rem var(--font-display); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rv-avatar.free { background:var(--surface-2); color:var(--ink-soft); }
  .rv-avatar.none { background:repeating-linear-gradient(45deg,var(--surface-2) 0 4px,var(--border) 4px 8px); color:var(--ink-faint); }
  .rv-name { font-weight:700; font-size:.9rem; line-height:1.2; } .rv-sub { font-size:.72rem; color:var(--ink-faint); }
  .rv-badge { display:inline-block; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
  .rv-badge.free { background:var(--surface-2); color:var(--ink-soft); } .rv-badge.over { background:var(--danger); color:#fff; }
  .rv-chev { margin-left:auto; width:14px; height:14px; color:var(--ink-faint); transition:transform .15s; flex-shrink:0; } .rv-row.open .rv-chev { transform:rotate(180deg); }
  .rv-thr { display:inline-flex; align-items:center; gap:5px; margin-top:4px; font-size:.68rem; color:var(--ink-faint); }
  .rv-thr b { font-family:var(--font-mono); color:var(--ink); min-width:12px; text-align:center; } .rv-thr.custom b { color:var(--accent-2); }
  .rv-thr button { width:17px; height:17px; padding:0; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font:700 .8rem/1 var(--font-body); cursor:pointer; }
  .rv-thr button:hover { border-color:var(--accent-2); color:var(--accent-2); }
  .rv-cell { position:relative; height:30px; border-radius:5px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font:700 .76rem var(--font-mono); color:transparent; }
  .rv-cell.l1, .rv-l1 { background:color-mix(in srgb, var(--accent-2) 24%, var(--surface)); } .rv-cell.l1 { color:var(--accent-2); }
  .rv-cell.l2, .rv-l2 { background:color-mix(in srgb, var(--accent-2) 62%, var(--surface)); } .rv-cell.l2 { color:#fff; }
  .rv-cell.l3, .rv-l3 { background:var(--orange); } .rv-cell.l3 { color:#fff; }
  .rv-cell.l4, .rv-l4 { background:var(--danger); } .rv-cell.l4 { color:#fff; }
  .rv-cell.today { outline:2px solid var(--accent-2); outline-offset:1px; }
  .rv-stats { display:flex; flex-direction:column; gap:1px; padding:0 8px; font-size:.74rem; color:var(--ink-soft); } .rv-stats strong { color:var(--ink); font-family:var(--font-mono); }
  .rv-detail, .rv-unlist { border-top:1px dashed var(--border); background:var(--surface-2); padding:6px 0 10px; }
  .rv-act { padding:5px 0; }
  .rv-act-label { padding:0 8px 0 52px; font-size:.8rem; font-weight:600; line-height:1.25; cursor:pointer; } .rv-act-label:hover { color:var(--accent-2); }
  .rv-act-label small { display:block; font-weight:400; color:var(--ink-faint); font-size:.7rem; }
  .rv-act-track { display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:3px; margin:0 8px; height:12px; }
  .rv-act-bar { height:10px; margin-top:1px; border-radius:4px; cursor:pointer; }
  .rv-act-pct { padding:0 8px; font:700 .76rem var(--font-mono); color:var(--ink-soft); display:flex; align-items:center; justify-content:flex-end; gap:8px; }
  .rv-reassign { font:600 .7rem var(--font-body); border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink-soft); padding:2px 4px; max-width:120px; cursor:pointer; }
  .rv-unrow { background:repeating-linear-gradient(45deg,var(--surface) 0 8px,var(--surface-2) 8px 16px); }
  .rv-unmid { margin:0 8px; font-size:.84rem; color:var(--ink-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .rv-unact { grid-template-columns:250px 1fr 190px; } .rv-unmeta { margin:0 8px; font-size:.72rem; color:var(--ink-soft); font-weight:600; }
  .rv-more { margin:4px 8px 0 52px; font-size:.78rem; color:var(--ink-soft); } .rv-more a { color:var(--accent-2); font-weight:700; cursor:pointer; }
  .rv-legend { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-top:14px; font-size:.76rem; color:var(--ink-soft); }
  .rv-legend .sw { display:inline-block; width:16px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  @media (max-width:1150px){ .rv-kpis{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:900px){ .rv-kpis{grid-template-columns:repeat(2,1fr);} .rv-card{overflow-x:auto;} .rv-grid-head,.rv-row,.rv-act{min-width:760px;} }

  .view-tabs { display: flex; gap: 4px; margin: -6px 0 18px; border-bottom: 1px solid var(--border); }
  .view-tab { padding: 9px 18px; font-size: 0.86rem; font-weight: 700; color: var(--ink-soft); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; font-family: inherit; }
  .view-tab:hover { color: var(--ink); }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---- Vue Radar (partage client) ---- */
  .rc-grid { display: grid; grid-template-columns: minmax(300px, 1.25fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .rc-grid { grid-template-columns: 1fr; } }
  .rc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  .rc-card h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.05rem; }
  .rc-tile { display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: 8px; background: #101010; border: 1px solid var(--border); border-left: 4px solid var(--accent); margin-bottom: 20px; flex-wrap: wrap; }
  .rc-tile .num { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 700; line-height: 1; }
  .rc-tile .lab { font-size: 0.74rem; opacity: .75; text-transform: uppercase; letter-spacing: .05em; font-family: var(--font-display); }
  .rc-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 10px; }
  .rc-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; font-size: 0.8rem; user-select: none; background: var(--surface); color: var(--ink); }
  .rc-chip.off { opacity: .45; } .rc-chip.na { opacity: .35; cursor: not-allowed; }
  .rc-chip:not(.na):hover { border-color: var(--accent-2); }
  .rc-chip svg { width: 26px; height: 10px; flex-shrink: 0; }
  .rc-radar { max-width: 520px; margin: 0 auto; }
  .rc-radar svg.radar { width: 100%; height: auto; display: block; }
  svg.radar text { font-family: var(--font-mono); fill: var(--ink-soft); }
  svg.radar .ring { fill: none; stroke: var(--border); } svg.radar .axis { stroke: var(--border); }
  .rc-back { background: none; border: none; padding: 0 0 6px; color: var(--accent-2); font: 700 0.8rem var(--font-display); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  .rc-back:hover { text-decoration: underline; }
  .rc-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 0.78rem; }
  .rc-legend div { display: flex; align-items: center; gap: 8px; } .rc-legend div > span:nth-child(2) { flex: 1; color: var(--ink-soft); }
  .rc-legend .dot { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 0.65rem; font-weight: 700; color: #0b0d10; flex-shrink: 0; }
  .rc-legend .sc { font-family: var(--font-mono); font-weight: 700; color: var(--ink); }
  .rc-hint { font-size: 0.76rem; color: var(--ink-faint); text-align: center; margin: 8px 0 0; }
  .rc-lvwrap { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .rc-lvtitle { font: 700 0.72rem var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin-bottom: 6px; }
  .rc-levels { display: flex; gap: 6px; }
  .rc-level { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 4px; padding: 5px 4px; cursor: help; background: var(--surface); text-align: center; position: relative; }
  .rc-level .bd { display: inline-block; font: 700 0.62rem var(--font-display); text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 3px; }
  .rc-level .bd.lvl1, .rc-level .bd.lvl2 { background: var(--danger-soft); color: var(--danger); }
  .rc-level .bd.lvl3 { background: var(--amber-soft); color: var(--amber); }
  .rc-level .bd.lvl4, .rc-level .bd.lvl5 { background: var(--good-soft); color: var(--good); }
  .rc-level .rg { display: block; margin-top: 4px; font-size: 0.66rem; font-weight: 700; color: var(--ink-soft); font-family: var(--font-mono); }
  [data-rtip] { position: relative; }

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseYmd(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
// Affichage des dates à la française (JJ/MM/AAAA) plutôt que le format ISO brut (AAAA-MM-JJ).
function fmtDateFr(s) { const d = parseYmd(s); return d ? d.toLocaleDateString('fr-FR', { timeZone: 'UTC' }) : ''; }

let DATA = null;

function pillarName(id) { return (DATA.pillars.find(p => p.id === id) || {}).name || ''; }
function subprocessName(id) { return (DATA.subprocesses.find(s => s.id === id) || {}).name || ''; }

function isOverdue(a) {
  const today = new Date().toISOString().slice(0, 10);
  return !!(a.due_date && a.status !== 'termine' && a.status !== 'abandonne' && a.status !== 'non_retenu' && a.due_date < today);
}

function ganttDateRange() {
  const dated = DATA.actions.filter(a => a.start_date || a.due_date);
  if (!dated.length) return null;
  let min = null, max = null;
  dated.forEach(a => {
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!min || s < min) min = s;
    if (!max || d > max) max = d;
  });
  const start = new Date(Date.UTC(min.getUTCFullYear(), min.getUTCMonth(), 1));
  const end = new Date(Date.UTC(max.getUTCFullYear(), max.getUTCMonth() + 1, 0));
  return { start, end };
}
function ganttDateToPct(d, range) { return Math.max(0, Math.min(100, (d - range.start) / (range.end - range.start) * 100)); }
const GANTT_MONTH_NAMES = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
function ganttAxisBoundaries(range, zoom) {
  const b = []; let cur = new Date(range.start);
  const step = zoom === 'quarter' ? 3 : zoom === 'week' ? null : 1;
  if (zoom === 'week') {
    cur = new Date(range.start);
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(cur.getTime() + 7 * 86400000); }
    b.push(new Date(range.end.getTime() + 86400000));
  } else {
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + step, 1)); }
    b.push(cur);
  }
  return b;
}
function ganttSegmentLabel(b, zoom) {
  if (zoom === 'quarter') return `T${Math.floor(b.getUTCMonth() / 3) + 1} ${b.getUTCFullYear()}`;
  if (zoom === 'week') return `${String(b.getUTCDate()).padStart(2, '0')}/${String(b.getUTCMonth() + 1).padStart(2, '0')}`;
  return GANTT_MONTH_NAMES[b.getUTCMonth()];
}

function pillarStats(items) {
  let totalDays = 0, hasDated = false, minStart = null, maxEnd = null, lateCount = 0;
  items.forEach(a => {
    if (isOverdue(a)) lateCount++;
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!s || !d) return;
    hasDated = true;
    if (!minStart || s < minStart) minStart = s;
    if (!maxEnd || d > maxEnd) maxEnd = d;
    if (a.status === 'termine' || a.status === 'abandonne' || a.status === 'non_retenu') return;
    totalDays += Math.max(1, Math.round((d - s) / 86400000) + 1);
  });
  const avgPct = items.length ? Math.round(items.reduce((sum, a) => sum + (a.progress_pct != null ? a.progress_pct : 0), 0) / items.length) : 0;
  const allDone = items.length > 0 && items.every(a => a.status === 'termine');
  return { totalDays: hasDated ? totalDays : null, avgPct, minStart, maxEnd, lateCount, allDone };
}

function toolbarHtml(termFilter, zoom, globalStats) {

function renderGantt() {
  const app = document.getElementById('app');
  const termFilter = state.term;
  const visible = DATA.actions.filter(a => !termFilter || a.term === termFilter);
  const dated = visible.filter(a => a.start_date || a.due_date);
  const undated = visible.filter(a => !a.start_date && !a.due_date);
  const range = ganttDateRange();
  const zoom = state.zoom;

  const byPillar = new Map();
  dated.forEach(a => { if (!byPillar.has(a.pillar_id)) byPillar.set(a.pillar_id, []); byPillar.get(a.pillar_id).push(a); });
  const sortKey = (a) => { const d = parseYmd(a.start_date) || parseYmd(a.due_date); return d ? d.getTime() : Infinity; };
  const pillarBlocks = DATA.pillars.filter(p => byPillar.has(p.id)).map(p => ({ pillar: p, items: byPillar.get(p.id).slice().sort((x, y) => sortKey(x) - sortKey(y)) }));

  let gridCss = 'none', axisHtml = '';
  if (range) {
    const boundaries = ganttAxisBoundaries(range, zoom);
    const segments = [];
    for (let i = 0; i < boundaries.length - 1; i++) {
      const segStart = boundaries[i] < range.start ? range.start : boundaries[i];
      const segEnd = boundaries[i + 1] > range.end ? range.end : boundaries[i + 1];
      segments.push({ boundary: boundaries[i], widthPct: Math.max(0, (segEnd - segStart) / (range.end - range.start) * 100) });
    }
    const stops = []; let acc = 0;
    segments.forEach(s => { stops.push(`var(--border) ${acc}%`, `var(--border) calc(${acc}% + 1px)`, `transparent calc(${acc}% + 1px)`); acc += s.widthPct; });
    gridCss = `linear-gradient(to right, ${stops.join(',')})`;
    axisHtml = segments.map(s => `<div style="width:${s.widthPct}%;">${esc(ganttSegmentLabel(s.boundary, zoom))}</div>`).join('');
  }

  const globalStats = pillarStats(dated);

  const pillarBlocksHtml = pillarBlocks.length ? pillarBlocks.map(({ pillar, items }) => {
    const { totalDays, avgPct, minStart, maxEnd, lateCount, allDone } = pillarStats(items);
    const isOpen = state.pillarOpen[pillar.id] !== false;
    let barHtml = '';
    if (minStart && maxEnd && range) {
      let leftPct = ganttDateToPct(minStart, range), rightPct = ganttDateToPct(maxEnd, range);
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      barHtml = `<div class="pillar-bar" style="left:${leftPct}%;width:${Math.max(0, Math.min(100 - leftPct, rightPct - leftPct))}%;"></div>`;
    }
    const rowsHtml = isOpen ? items.map(a => {
      const overdue = isOverdue(a);
      const color = a.term === 'court' ? 'var(--danger)' : a.term === 'moyen' ? 'var(--amber)' : 'var(--good)';
      const s = parseYmd(a.start_date) || parseYmd(a.due_date), d = parseYmd(a.due_date) || parseYmd(a.start_date);
      let leftPct = range ? ganttDateToPct(s, range) : 0, rightPct = range ? ganttDateToPct(d, range) : 0;
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      const widthPct = Math.max(0, Math.min(100 - leftPct, rightPct - leftPct));
      const muted = a.status === 'abandonne' || a.status === 'non_retenu';
      const barStyle = muted ? `left:${leftPct}%;width:${widthPct}%;` : `left:${leftPct}%;width:${widthPct}%;background:${color};opacity:${a.status === 'termine' ? 0.5 : 1};`;
      return `<div class="row" data-action-id="${a.id}">
        <div class="row-label">
          <div class="row-title">${esc(a.title)}${overdue ? ' ⚠' : ''}</div>
          <div class="row-sub">${a.subprocess_id != null ? esc(subprocessName(a.subprocess_id)) : ''}</div>
          ${a.responsible_label ? `<div class="row-resp">${esc(a.responsible_label)}</div>` : ''}
        </div>
        <div class="row-track" style="background-image:${gridCss};"><div class="bar ${muted ? 'bar-muted' : ''}" style="${barStyle}"></div></div>
        <div class="pct-cell" style="color:${muted ? 'var(--ink-faint)' : color};">${a.progress_pct != null ? a.progress_pct : 0}%</div>
      </div>`;
    }).join('') : '';
    return `
    <div class="pillar-header ${isOpen ? 'open' : ''}${allDone ? ' done' : ''}" data-pillar-id="${pillar.id}">
      <div class="pillar-left">
        <span class="pillar-name">${esc(pillar.name)}</span>
        <span class="pillar-count">${items.length} action${items.length > 1 ? 's' : ''}</span>
        ${allDone ? '<span class="pillar-done-badge">✓ Pilier terminé</span>' : ''}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="pillar-track" style="background-image:${gridCss};">${barHtml}</div>
      <div class="pillar-stats">
        <div>Durée des actions restantes : <strong>${totalDays != null ? totalDays + ' j' : '—'}</strong></div>
        <div>Avancement moyen : <strong>${avgPct}%</strong></div>
        <div class="${lateCount > 0 ? 'stat-late' : ''}">Actions en retard : <strong>${lateCount}</strong></div>
      </div>
    </div>
    ${rowsHtml}`;
  }).join('') : `<div class="empty-note">Aucune action datée${termFilter ? ' pour ce terme' : ''}.</div>`;

  const undatedHtml = undated.length ? `<div class="empty-note">${undated.length} action${undated.length > 1 ? 's' : ''} sans échéance définie (non représentée${undated.length > 1 ? 's' : ''} sur la frise).</div>` : '';

  app.innerHTML = `
    ${headerHtml()}
    ${tabsHtml()}
    ${toolbarHtml(termFilter, zoom, globalStats)}
    <div class="card">
      ${range ? `<div class="axis"><div class="axis-spacer"></div><div class="axis-track">${axisHtml}</div><div class="axis-pct">Avancement</div></div>` : ''}
      ${pillarBlocksHtml}
    </div>
    ${undatedHtml}
    <div class="footer-note">Vue en lecture seule — généré par ChainPulse v${APP_VERSION}</div>
  `;

  attachCommon(app);
  app.querySelectorAll('[data-pillar-id]').forEach(el => el.onclick = () => {
    const pid = el.dataset.pillarId;
    state.pillarOpen[pid] = state.pillarOpen[pid] === false ? true : false;
    render();
  });
}

const RV_INACTIVE = ['termine', 'abandonne', 'non_retenu'];
const RV_DEFAULT_THR = 3;

// Responsable d'une action : interviewé(e) (clé = id) ou nom libre regroupé
// par nom exact (clé = n:nom en minuscules). null = sans responsable.
function rvResolve(a) {
  if (!a.resp_key) return null;
  return { key: a.resp_key, name: a.responsible_label, sub: a.resp_free ? 'Nom saisi librement (sans fiche)' : (a.resp_sub || ''), free: !!a.resp_free };
}
function ymdOf(d) { return d.toISOString().slice(0, 10); }
function rvPeriods(range, zoom) {
  const b = ganttAxisBoundaries(range, zoom);
  const out = [];
  for (let i = 0; i < b.length - 1; i++) out.push({ s: b[i], e: new Date(b[i + 1].getTime() - 86400000), label: ganttSegmentLabel(b[i], zoom) });
  return out;
}
function rvLevel(n, t) { return n > t ? 'l4' : (n === t && n > 0) ? 'l3' : n >= 2 ? 'l2' : n === 1 ? 'l1' : ''; }
function rvActionDates(a) {
  const s = parseYmd(a.start_date) || parseYmd(a.due_date);
  const d = parseYmd(a.due_date) || parseYmd(a.start_date);
  return s && d ? { s, d } : null;
}

function buildResourcesHtml() {
  const thrOf = (key) => (DATA.thresholds && DATA.thresholds[key]) || RV_DEFAULT_THR;
  const termFilter = state.term;
  const zoom = state.zoom || 'month';
  const visible = DATA.actions.filter(a => !termFilter || a.term === termFilter);
  const range = ganttDateRange();
  const P = range ? rvPeriods(range, zoom) : [];
  const n = P.length;
  const today = new Date();
  const todayUtc = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const overlap = (a, b, c, d) => a <= d && c <= b;
  // Action "en retard" : échéance dépassée et encore active (même règle que le ⚠ du Gantt).
  const todayStr = ymdOf(todayUtc);
  const isLateA = (a) => !!(a.due_date && a.due_date < todayStr && RV_INACTIVE.indexOf(a.status) < 0);
  const lateDaysA = (a) => Math.round((todayUtc - parseYmd(a.due_date)) / 86400000);
  // Fin "effective" pour la charge : une action en retard est considérée comme
  // encore à faire jusqu'à aujourd'hui (la barre est prolongée en violet).
  const effEnd = (a, dd) => (isLateA(a) && todayUtc > dd.d) ? todayUtc : dd.d;
  const pillarName = (id) => (DATA.pillars.find(p => p.id === id) || {}).name || '';

  const groups = new Map();
  const unassigned = [];
  visible.forEach(a => {
    const r = rvResolve(a);
    const active = RV_INACTIVE.indexOf(a.status) < 0;
    if (!r) { if (active) unassigned.push(a); return; }
    if (!groups.has(r.key)) groups.set(r.key, { ...r, all: [], active: [] });
    const g = groups.get(r.key);
    g.all.push(a);
    if (active) g.active.push(a);
  });
  const resList = [...groups.values()].filter(g => g.active.length).sort((x, y) => x.name.localeCompare(y.name));
  resList.forEach(r => {
    r.thr = thrOf(r.key);
    r.dated = r.active.filter(rvActionDates).sort((x, y) => rvActionDates(x).s - rvActionDates(y).s);
    r.undated = r.active.filter(a => !rvActionDates(a));

  const best = ranked[0];

function renderResources() {

  app.querySelectorAll('[data-rv-row]').forEach(el => el.onclick = () => { state.resOpen[el.dataset.rvRow] = !state.resOpen[el.dataset.rvRow]; render(); });

    const iy = ly + (Math.sin(a) >= 0 ? 22 : -22);
    const iconSvg = it.icon
      ? `<svg x="${(ix - 9).toFixed(1)}" y="${(iy - 9).toFixed(1)}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${labelColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">${it.icon}</svg>`
      : '';
    const iconHit = (it.icon && it.pillarId != null)
      ? `<circle class="radar-icon-hit" data-radar-pillar-icon="${esc(String(it.pillarId))}" cx="${ix}" cy="${iy}" r="14" style="fill:transparent;cursor:pointer;"><title>${esc(it.title || '')}</title></circle>`
      : '';
    return `<line class="axis" x1="${center}" y1="${center}" x2="${x2}" y2="${y2}"></line>
      <text x="${lx}" y="${ly}" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="fill:${labelColor};">${titleTag}${esc(it.label)}</text>
      ${iconHit}${iconSvg}`;
  }).join('');
  // Une ou plusieurs courbes (audit précédent, actuel, après actions, projection) :
  // series = [{ vals:[…], color, dash, fill, dots }]. Une valeur nulle est tracée à 0.
  const shapes = (series || []).map(se => {
    const pts = items.map((it, i) => {
      const v = se.vals[i] != null ? se.vals[i] : 0;
      const r = (v / 5) * maxR, a = angle(i);
      return [center + r * Math.cos(a), center + r * Math.sin(a)];
    });
    const poly = `<polygon points="${pts.map(q => q.join(',')).join(' ')}" fill="${se.color}" fill-opacity="${se.fill}" stroke="${se.color}" stroke-width="1.3" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round" style="pointer-events:none"></polygon>`;
    const dots = se.dots ? pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="2.8" style="fill:${se.color};pointer-events:none" stroke="var(--surface)" stroke-width="1"></circle>`).join('') : '';
    return poly + dots;
  }).join('');
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" style="width:100%;height:100%;max-width:100%;max-height:100%;display:block;margin:0 auto;">
    ${rings}${axes}${scaleLabels}
    ${shapes}
  </svg>`;
}

state.radarSeries = { prev: true, now: true, after: true };
state.radarDrill = null;

function radarModel() {
  const R = DATA.radar || {};
  const excluded = new Set((R.excluded || []).map(Number));
  const rec = {}; (R.scores || []).forEach(s => { rec[s.subprocess_id] = { score: Number(s.score), weight: s.weight == null ? 1 : Number(s.weight) }; });
  const pw = {}; (R.pillar_weights || []).forEach(w => { pw[w.pillar_id] = Number(w.weight); });
  const subsOf = (pid) => (DATA.subprocesses || []).filter(sp => sp.pillar_id === pid && !excluded.has(Number(sp.id))).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const ov = {};
  (DATA.actions || []).forEach(a => {
    if (a.status !== 'termine' || a.subprocess_id == null || a.target_score == null) return;
    const cur = rec[a.subprocess_id] ? rec[a.subprocess_id].score : null;
    const v = cur != null ? Math.max(cur, Number(a.target_score)) : Number(a.target_score);
    if (ov[a.subprocess_id] == null || v > ov[a.subprocess_id]) ov[a.subprocess_id] = v;
  });
  const pScore = (pid, useOv) => {
    let sW = 0, sWS = 0;
    subsOf(pid).forEach(sp => {
      const r = rec[sp.id]; const o = useOv ? ov[sp.id] : null;
      const sc = o != null ? o : (r ? r.score : null);
      if (sc == null) return;
      const w = r ? r.weight : 1; sW += w; sWS += w * sc;
    });
    return sW > 0 ? sWS / sW : null;
  };
  const groups = (DATA.pillars || []).filter(p => subsOf(p.id).length > 0);
  const gScore = (useOv) => {
    let sW = 0, sWS = 0;
    groups.forEach(p => { const v = pScore(p.id, useOv); if (v == null) return; const w = pw[p.id] != null ? pw[p.id] : 1; sW += w; sWS += w * v; });
    return sW > 0 ? sWS / sW : null;
  };
  return { R, rec, ov, subsOf, pScore, groups, gScore, prev: R.prev || null };
}

function renderRadar() {
  const app = document.getElementById('app');
  const M = radarModel();
  if (!M.groups.length) { app.innerHTML = `${headerHtml()}${tabsHtml()}<div class="state-msg">Aucune note disponible pour le moment.</div>`; attachCommon(app); return; }
  const prev = M.prev;
  const drillG = state.radarDrill != null ? M.groups.find(p => String(p.id) === String(state.radarDrill)) : null;
  let items, vals, prevOk;
  if (!drillG) {
    items = M.groups.map(p => ({ label: p.code || p.name.charAt(0), title: p.name, score: M.pScore(p.id, false), icon: PILLAR_ICON_SVG[p.name] || PILLAR_ICON_FALLBACK, pillarId: p.id }));
    vals = {
      prev: M.groups.map(p => (prev && prev.pillars && prev.pillars[p.id] != null) ? Number(prev.pillars[p.id]) : null),
      now: items.map(it => it.score),
      after: M.groups.map(p => M.pScore(p.id, true)),
    };
    prevOk = !!prev;
  } else {
    const subs = M.subsOf(drillG.id);
    items = subs.map((sp, i) => ({ label: String(i + 1), title: sp.name, score: M.rec[sp.id] ? M.rec[sp.id].score : null }));
    vals = {
      prev: subs.map(sp => (prev && prev.subs && prev.subs[sp.id] != null) ? Number(prev.subs[sp.id]) : null),
      now: items.map(it => it.score),
      after: subs.map((sp, i) => M.ov[sp.id] != null ? M.ov[sp.id] : items[i].score),
    };
    prevOk = !!(prev && prev.subs);
  }
  const prevLabel = 'Audit précédent' + (prev && prev.date ? ' (' + new Date(prev.date).toLocaleDateString('fr-FR') + ')' : '');
  const DEFS = [
    { key: 'prev', label: prevLabel, color: 'var(--ink-soft)', dash: '5 4', fill: 0, dots: false, na: !prevOk, naMsg: !prev ? 'Aucun audit précédent.' : 'Détail par sous-processus indisponible pour l\'audit précédent.' },
    { key: 'now', label: 'Audit actuel — fin des interviews', color: 'var(--accent-2)', dash: '', fill: 0.14, dots: true },
    { key: 'after', label: 'Après actions réalisées', color: 'var(--good)', dash: '', fill: 0.10, dots: true },
  ];
  const active = DEFS.filter(d => !d.na && state.radarSeries[d.key]);
  const chips = DEFS.map(d => `<span class="rc-chip ${d.na ? 'na' : (state.radarSeries[d.key] ? '' : 'off')}" ${d.na ? `title="${esc(d.naMsg)}"` : `data-rseries="${d.key}"`}><svg viewBox="0 0 26 10"><line x1="1" y1="5" x2="25" y2="5" stroke="${d.color}" stroke-width="2" ${d.dash ? `stroke-dasharray="${d.dash}"` : ''}/></svg>${esc(d.label)}</span>`).join('');
  const svg = buildRadarSvg(items, 320, active.map(d => ({ vals: vals[d.key], color: d.color, dash: d.dash, fill: d.fill, dots: d.dots })));
  const legend = !drillG ? '' : `<div class="rc-legend">${M.subsOf(drillG.id).map((sp, i) => { const has = vals.now[i] != null; return `<div><span class="dot" style="background:${has ? levelColorVar(vals.now[i]) : 'var(--ink-faint)'}">${i + 1}</span><span>${esc(sp.name)}</span><span class="sc">${has ? fmt1(vals.now[i]) : '—'}${vals.after[i] != null && vals.after[i] !== vals.now[i] ? ' → ' + fmt1(vals.after[i]) : ''}</span></div>`; }).join('')}</div>`;
  const title = drillG
    ? `<button type="button" class="rc-back" data-rback><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Retour aux piliers</button><h3>Sous-processus — ${esc(drillG.name)}</h3>`
    : `<h3>Radar par pilier audité</h3>`;
  const levelsHtml = RADAR_LEVELS.map(l => `<div class="rc-level" data-rtip="${esc(l[3])}"><span class="bd ${l[0]}">${l[1]}</span><span class="rg">${l[2]}</span></div>`).join('');
  const nowG = M.gScore(false), afterG = M.gScore(true), prevG = prev && prev.global != null ? Number(prev.global) : null;
  const dcell = (a, b) => { if (a == null || b == null) return '<td>—</td>'; const d = diff1(a, b); return `<td><span class="${d > 0 ? 'rc-up' : d < 0 ? 'rc-dn' : 'rc-eq'}">${d > 0 ? '↑+' : d < 0 ? '↓' : '±'}${fmt1(Math.abs(d))}</span></td>`; };
  const sc = (v) => v != null ? `<td><span style="color:${levelColorVar(v)};font-weight:600">${fmt1(v)}</span></td>` : '<td>—</td>';
  const pl = (v) => `<td>${v != null ? fmt1(v) : '—'}</td>`;
  const rowsHtml = M.groups.map(p => {
    const pv = (prev && prev.pillars && prev.pillars[p.id] != null) ? Number(prev.pillars[p.id]) : null;
    const n = M.pScore(p.id, false), a = M.pScore(p.id, true);
    return `<tr data-rpid="${p.id}" title="Cliquer pour le détail par sous-processus"><td><span style="display:inline-flex;align-items:center;gap:7px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">${PILLAR_ICON_SVG[p.name] || PILLAR_ICON_FALLBACK}</svg>${esc(p.name)}</span></td>${pl(pv)}${sc(n)}${dcell(n, pv)}${sc(a)}${dcell(a, n)}</tr>`;
  }).join('');
  const table = `<table class="rc-table"><thead><tr><th>Pilier</th>
    <th data-rtip="Score du pilier lors de l'audit précédent.">Préc.</th>
    <th data-rtip="Score du pilier à la fin des interviews de l'audit en cours.">Actuel</th>
    <th data-rtip="Progression entre l'audit précédent et l'audit actuel (Actuel − Préc.).">Écart</th>
    <th data-rtip="Score une fois prises en compte les actions déjà terminées du plan de progrès.">Après</th>
    <th data-rtip="Gain apporté par les actions terminées (Après − Actuel).">Écart</th></tr></thead>
    <tbody><tr style="font-weight:700"><td>Maturité globale</td>${pl(prevG)}${pl(nowG)}${dcell(nowG, prevG)}${pl(afterG)}${dcell(afterG, nowG)}</tr>${rowsHtml}</tbody></table>`;
  app.innerHTML = `
    ${headerHtml()}
    ${tabsHtml()}
    <div class="rc-tile"><div><div class="num">${nowG != null ? fmt1(nowG) : '—'}</div><div class="lab">Score global / 5</div></div>
      ${nowG != null ? `<div style="font-size:.9rem;">Niveau de maturité global : <strong>${RADAR_LEVELS[Math.min(5, Math.max(1, Math.round(nowG))) - 1][1]}</strong></div>` : ''}</div>
    <div class="rc-grid">
      <div class="rc-card">
        ${title}
        <div class="rc-chips">${chips}</div>
        <div class="rc-radar">${svg}</div>${legend}
        <div class="rc-lvwrap"><div class="rc-lvtitle">Niveaux de maturité</div><div class="rc-levels">${levelsHtml}</div></div>
        ${drillG ? '' : `<p class="rc-hint">Cliquez sur l'icône d'un pilier (ou sur sa ligne du tableau) pour voir le détail par sous-processus.</p>`}
      </div>
      <div class="rc-card"><h3>Détail par pilier audité</h3>${table}</div>
    </div>
    <div class="footer-note">Vue en lecture seule — généré par ChainPulse v${APP_VERSION}</div>`;
  attachCommon(app);
  app.querySelectorAll('[data-rseries]').forEach(el => el.onclick = () => { const k = el.dataset.rseries; state.radarSeries[k] = !state.radarSeries[k]; render(); });
  app.querySelectorAll('[data-radar-pillar-icon]').forEach(el => el.onclick = () => { state.radarDrill = el.dataset.radarPillarIcon; render(); });
  app.querySelectorAll('[data-rpid]').forEach(el => el.onclick = () => { state.radarDrill = el.dataset.rpid; render(); });
  app.querySelectorAll('[data-rback]').forEach(el => el.onclick = () => { state.radarDrill = null; render(); });
}

function render() {
  const views = (DATA.views && DATA.views.length) ? DATA.views : ['gantt'];
  if (!views.includes(state.view)) state.view = views[0];
  if (state.view === 'resources') renderResources(); else if (state.view === 'radar') renderRadar(); else renderGantt();
}

main();
</script>
</body>
