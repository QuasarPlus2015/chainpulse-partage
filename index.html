<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ChainPulse — Plan de progrès (partage)</title>
<style>
  :root {
    --bg: #1a1a1a; --surface: #232323; --surface-2: #2a2a2a; --border: #3a3a3a;
    --ink: #f2f2f2; --ink-soft: #c7c7c7; --ink-faint: #8d8d8d;
    --accent: #d61313; --danger: #e05656; --amber: #e0a040; --good: #4dbd74;
    --danger-soft: #3a1414; --amber-soft: #3a2a10; --good-soft: #10301c;
    --font: 'Source Sans Pro', Arial, sans-serif; --font-display: 'Raleway', Arial, sans-serif; --font-mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
  header.top .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--accent); }
  header.top .meta { text-align: right; }
  header.top .meta .company { font-size: 1.1rem; font-weight: 700; }
  header.top .meta .audit { font-size: 0.85rem; color: var(--ink-faint); }
  .state-msg { padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 0.95rem; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .term-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .term-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-soft); font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .term-chip.active { background: var(--surface-2); color: var(--ink); border-color: var(--ink-faint); }
  .term-dot { width: 9px; height: 9px; border-radius: 50%; }
  .term-dot-court { background: var(--danger); } .term-dot-moyen { background: var(--amber); } .term-dot-long { background: var(--good); }
  .global-stats { display: flex; align-items: center; gap: 16px; padding-left: 14px; border-left: 1px solid var(--border); font-size: 0.78rem; color: var(--ink-soft); }
  .global-stats strong { color: var(--ink); font-family: var(--font-mono); }
  .zoom-control { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .zoom-btn { padding: 6px 14px; font-size: 0.75rem; font-weight: 700; background: none; border: none; border-right: 1px solid var(--border); color: var(--ink-soft); cursor: pointer; }
  .zoom-btn:last-child { border-right: none; }
  .zoom-btn.active { background: var(--surface-2); color: var(--ink); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .axis { display: flex; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .axis-spacer { width: 260px; flex-shrink: 0; }
  .axis-track { flex: 1; display: flex; }
  .axis-track > div { text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--ink-faint); padding: 8px 0; box-sizing: border-box; white-space: nowrap; overflow: hidden; }
  .axis-pct { width: 90px; flex-shrink: 0; text-align: center; font-size: 0.66rem; font-weight: 700; color: var(--ink-faint); padding: 8px 0; }
  .pillar-header { display: flex; align-items: center; background: var(--surface-2); margin-top: 10px; padding: 8px 0; cursor: pointer; }
  .pillar-header.done { background: var(--good-soft); }
  .pillar-left { width: 260px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .pillar-name { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .pillar-count { font-size: 0.72rem; color: var(--ink-faint); }
  .pillar-done-badge { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--good); color: var(--surface); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; }
  .chev { margin-left: auto; width: 14px; height: 14px; color: var(--ink-faint); transition: transform .15s; }
  .pillar-header.open .chev { transform: rotate(180deg); }
  .pillar-track { flex: 1; position: relative; margin: 0 2px; height: 10px; border-radius: 4px; overflow: hidden; }
  .pillar-bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--ink-faint); opacity: .5; }
  .pillar-stats { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 14px; font-size: 0.72rem; color: var(--ink-soft); }
  .pillar-stats strong { color: var(--ink); font-family: var(--font-mono); }
  .stat-late strong { color: var(--danger); }
  .row { display: flex; align-items: center; min-height: 54px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover { background: var(--surface-2); }
  .row-label { width: 260px; flex-shrink: 0; padding: 8px 12px; }
  .row-title { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
  .row-sub { font-size: 0.7rem; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-resp { font-size: 0.7rem; color: #fff; font-weight: 600; margin-top: 2px; }
  .row-track { flex: 1; position: relative; height: 10px; margin: 0 2px; }
  .bar { position: absolute; top: 0; height: 10px; border-radius: 4px; }
  .bar-muted { background: repeating-linear-gradient(45deg, var(--surface-2) 0, var(--surface-2) 4px, var(--border) 4px, var(--border) 8px); }
  .pct-cell { width: 90px; flex-shrink: 0; text-align: center; font-size: 0.78rem; font-family: var(--font-mono); font-weight: 700; }
  .empty-note { padding: 20px; color: var(--ink-faint); font-size: 0.85rem; text-align: center; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .modal .breadcrumb { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; }
  .modal .field { margin-bottom: 12px; }
  .modal .field label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); margin-bottom: 3px; }
  .modal .field .val { font-size: 0.88rem; }
  .modal .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 1.1rem; }
  .status-badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .footer-note { margin-top: 30px; text-align: center; font-size: 0.72rem; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state-msg">Chargement…</div>
</div>
<script>
const SUPABASE_URL = 'https://dvveswkpyxqscyozzaqg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CJI_sDeM9vKW0HG-TzfePg_fhEdnwn1';
const TERM_LABELS = { court: 'Court terme', moyen: 'Moyen terme', long: 'Long terme' };
const STATUS_LABELS = { a_demarrer: 'À démarrer', en_cours: 'En cours', termine: 'Terminée', abandonne: 'Abandonnée', non_retenu: 'Non retenue par le client' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseYmd(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }

let DATA = null;
const state = { term: null, zoom: 'month', pillarOpen: {} };

async function main() {
  const app = document.getElementById('app');
  const token = new URLSearchParams(location.search).get('token');
  if (!token) { app.innerHTML = '<div class="state-msg">Lien invalide : aucun jeton de partage fourni.</div>'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_public_gantt`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    if (!res.ok) {
      const txt = await res.text();
      if (txt.includes('invalid_or_revoked_link')) {
        app.innerHTML = '<div class="state-msg">Ce lien de partage n\'est plus valide : il a peut-être été révoqué. Merci de demander un nouveau lien.</div>';
      } else {
        app.innerHTML = '<div class="state-msg">Impossible de charger ce plan de progrès pour le moment. Merci de réessayer plus tard.</div>';
      }
      return;
    }
    DATA = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="state-msg">Impossible de contacter le serveur. Vérifiez votre connexion et réessayez.</div>';
    return;
  }
  render();
}

function pillarName(id) { return (DATA.pillars.find(p => p.id === id) || {}).name || ''; }
function subprocessName(id) { return (DATA.subprocesses.find(s => s.id === id) || {}).name || ''; }

function isOverdue(a) {
  const today = new Date().toISOString().slice(0, 10);
  return !!(a.due_date && a.status !== 'termine' && a.status !== 'abandonne' && a.status !== 'non_retenu' && a.due_date < today);
}

function ganttDateRange() {
  const dated = DATA.actions.filter(a => a.start_date || a.due_date);
  if (!dated.length) return null;
  let min = null, max = null;
  dated.forEach(a => {
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!min || s < min) min = s;
    if (!max || d > max) max = d;
  });
  const start = new Date(Date.UTC(min.getUTCFullYear(), min.getUTCMonth(), 1));
  const end = new Date(Date.UTC(max.getUTCFullYear(), max.getUTCMonth() + 1, 0));
  return { start, end };
}
function ganttDateToPct(d, range) { return Math.max(0, Math.min(100, (d - range.start) / (range.end - range.start) * 100)); }
const GANTT_MONTH_NAMES = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
function ganttAxisBoundaries(range, zoom) {
  const b = []; let cur = new Date(range.start);
  const step = zoom === 'quarter' ? 3 : zoom === 'week' ? null : 1;
  if (zoom === 'week') {
    cur = new Date(range.start);
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(cur.getTime() + 7 * 86400000); }
    b.push(new Date(range.end.getTime() + 86400000));
  } else {
    while (cur <= range.end) { b.push(new Date(cur)); cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + step, 1)); }
    b.push(cur);
  }
  return b;
}
function ganttSegmentLabel(b, zoom) {
  if (zoom === 'quarter') return `T${Math.floor(b.getUTCMonth() / 3) + 1} ${b.getUTCFullYear()}`;
  if (zoom === 'week') return `${String(b.getUTCDate()).padStart(2, '0')}/${String(b.getUTCMonth() + 1).padStart(2, '0')}`;
  return GANTT_MONTH_NAMES[b.getUTCMonth()];
}

function pillarStats(items) {
  let totalDays = 0, hasDated = false, minStart = null, maxEnd = null, lateCount = 0;
  items.forEach(a => {
    if (isOverdue(a)) lateCount++;
    const s = parseYmd(a.start_date) || parseYmd(a.due_date);
    const d = parseYmd(a.due_date) || parseYmd(a.start_date);
    if (!s || !d) return;
    hasDated = true;
    if (!minStart || s < minStart) minStart = s;
    if (!maxEnd || d > maxEnd) maxEnd = d;
    if (a.status === 'termine' || a.status === 'abandonne' || a.status === 'non_retenu') return;
    totalDays += Math.max(1, Math.round((d - s) / 86400000) + 1);
  });
  const avgPct = items.length ? Math.round(items.reduce((sum, a) => sum + (a.progress_pct != null ? a.progress_pct : 0), 0) / items.length) : 0;
  const allDone = items.length > 0 && items.every(a => a.status === 'termine');
  return { totalDays: hasDated ? totalDays : null, avgPct, minStart, maxEnd, lateCount, allDone };
}

function openActionModal(a) {
  const pName = pillarName(a.pillar_id);
  const spName = a.subprocess_id != null ? subprocessName(a.subprocess_id) : '';
  const statusColor = a.status === 'termine' ? 'var(--good)' : a.status === 'abandonne' || a.status === 'non_retenu' ? 'var(--ink-faint)' : 'var(--accent)';
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal" style="position:relative;">
      <button type="button" class="close-btn" id="am-close">✕</button>
      <div class="breadcrumb">${esc(pName)}${spName ? ' · ' + esc(spName) : ''}</div>
      <h3>${esc(a.title)}</h3>
      <div class="field"><label>Statut</label><div class="val"><span class="status-badge" style="background:${statusColor};color:#1a1a1a;">${esc(STATUS_LABELS[a.status] || a.status)}</span></div></div>
      ${a.description ? `<div class="field"><label>Description</label><div class="val">${esc(a.description)}</div></div>` : ''}
      <div class="field"><label>Terme</label><div class="val">${esc(TERM_LABELS[a.term] || a.term)}</div></div>
      <div class="field"><label>Dates</label><div class="val">${a.start_date ? 'Début : ' + a.start_date : ''}${a.start_date && a.due_date ? ' — ' : ''}${a.due_date ? 'Échéance : ' + a.due_date : ''}${!a.start_date && !a.due_date ? 'Non définies' : ''}</div></div>
      <div class="field"><label>% avancement</label><div class="val">${a.progress_pct != null ? a.progress_pct : 0}%</div></div>
      ${a.responsible_label ? `<div class="field"><label>Responsable</label><div class="val">${esc(a.responsible_label)}</div></div>` : ''}
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  wrap.querySelector('#am-close').onclick = () => wrap.remove();
}

function render() {
  const app = document.getElementById('app');
  const termFilter = state.term;
  const visible = DATA.actions.filter(a => !termFilter || a.term === termFilter);
  const dated = visible.filter(a => a.start_date || a.due_date);
  const undated = visible.filter(a => !a.start_date && !a.due_date);
  const range = ganttDateRange();
  const zoom = state.zoom;

  const byPillar = new Map();
  dated.forEach(a => { if (!byPillar.has(a.pillar_id)) byPillar.set(a.pillar_id, []); byPillar.get(a.pillar_id).push(a); });
  const sortKey = (a) => { const d = parseYmd(a.start_date) || parseYmd(a.due_date); return d ? d.getTime() : Infinity; };
  const pillarBlocks = DATA.pillars.filter(p => byPillar.has(p.id)).map(p => ({ pillar: p, items: byPillar.get(p.id).slice().sort((x, y) => sortKey(x) - sortKey(y)) }));

  let gridCss = 'none', axisHtml = '';
  if (range) {
    const boundaries = ganttAxisBoundaries(range, zoom);
    const segments = [];
    for (let i = 0; i < boundaries.length - 1; i++) {
      const segStart = boundaries[i] < range.start ? range.start : boundaries[i];
      const segEnd = boundaries[i + 1] > range.end ? range.end : boundaries[i + 1];
      segments.push({ boundary: boundaries[i], widthPct: Math.max(0, (segEnd - segStart) / (range.end - range.start) * 100) });
    }
    const stops = []; let acc = 0;
    segments.forEach(s => { stops.push(`var(--border) ${acc}%`, `var(--border) calc(${acc}% + 1px)`, `transparent calc(${acc}% + 1px)`); acc += s.widthPct; });
    gridCss = `linear-gradient(to right, ${stops.join(',')})`;
    axisHtml = segments.map(s => `<div style="width:${s.widthPct}%;">${esc(ganttSegmentLabel(s.boundary, zoom))}</div>`).join('');
  }

  const globalStats = pillarStats(dated);

  const pillarBlocksHtml = pillarBlocks.length ? pillarBlocks.map(({ pillar, items }) => {
    const { totalDays, avgPct, minStart, maxEnd, lateCount, allDone } = pillarStats(items);
    const isOpen = state.pillarOpen[pillar.id] !== false;
    let barHtml = '';
    if (minStart && maxEnd && range) {
      let leftPct = ganttDateToPct(minStart, range), rightPct = ganttDateToPct(maxEnd, range);
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      barHtml = `<div class="pillar-bar" style="left:${leftPct}%;width:${Math.max(0, Math.min(100 - leftPct, rightPct - leftPct))}%;"></div>`;
    }
    const rowsHtml = isOpen ? items.map(a => {
      const overdue = isOverdue(a);
      const color = a.term === 'court' ? 'var(--danger)' : a.term === 'moyen' ? 'var(--amber)' : 'var(--good)';
      const s = parseYmd(a.start_date) || parseYmd(a.due_date), d = parseYmd(a.due_date) || parseYmd(a.start_date);
      let leftPct = range ? ganttDateToPct(s, range) : 0, rightPct = range ? ganttDateToPct(d, range) : 0;
      if (rightPct - leftPct < 1.2) rightPct = leftPct + 1.2;
      const widthPct = Math.max(0, Math.min(100 - leftPct, rightPct - leftPct));
      const muted = a.status === 'abandonne' || a.status === 'non_retenu';
      const barStyle = muted ? `left:${leftPct}%;width:${widthPct}%;` : `left:${leftPct}%;width:${widthPct}%;background:${color};opacity:${a.status === 'termine' ? 0.5 : 1};`;
      return `<div class="row" data-action-id="${a.id}">
        <div class="row-label">
          <div class="row-title">${esc(a.title)}${overdue ? ' ⚠' : ''}</div>
          <div class="row-sub">${a.subprocess_id != null ? esc(subprocessName(a.subprocess_id)) : ''}</div>
          ${a.responsible_label ? `<div class="row-resp">${esc(a.responsible_label)}</div>` : ''}
        </div>
        <div class="row-track" style="background-image:${gridCss};"><div class="bar ${muted ? 'bar-muted' : ''}" style="${barStyle}"></div></div>
        <div class="pct-cell" style="color:${muted ? 'var(--ink-faint)' : color};">${a.progress_pct != null ? a.progress_pct : 0}%</div>
      </div>`;
    }).join('') : '';
    return `
    <div class="pillar-header ${isOpen ? 'open' : ''}${allDone ? ' done' : ''}" data-pillar-id="${pillar.id}">
      <div class="pillar-left">
        <span class="pillar-name">${esc(pillar.name)}</span>
        <span class="pillar-count">${items.length} action${items.length > 1 ? 's' : ''}</span>
        ${allDone ? '<span class="pillar-done-badge">✓ Pilier terminé</span>' : ''}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="pillar-track" style="background-image:${gridCss};">${barHtml}</div>
      <div class="pillar-stats">
        <div>Durée des actions restantes : <strong>${totalDays != null ? totalDays + ' j' : '—'}</strong></div>
        <div>Avancement moyen : <strong>${avgPct}%</strong></div>
        <div class="${lateCount > 0 ? 'stat-late' : ''}">Actions en retard : <strong>${lateCount}</strong></div>
      </div>
    </div>
    ${rowsHtml}`;
  }).join('') : `<div class="empty-note">Aucune action datée${termFilter ? ' pour ce terme' : ''}.</div>`;

  const undatedHtml = undated.length ? `<div class="empty-note">${undated.length} action${undated.length > 1 ? 's' : ''} sans échéance définie (non représentée${undated.length > 1 ? 's' : ''} sur la frise).</div>` : '';

  app.innerHTML = `
    <header class="top">
      <div class="brand">ChainPulse — Plan de progrès</div>
      <div class="meta"><div class="company">${esc(DATA.company_name || '')}</div><div class="audit">${esc(DATA.audit_label || '')}</div></div>
    </header>
    <div class="toolbar">
      <div class="term-chips">
        <div class="term-chip ${!termFilter ? 'active' : ''}" data-term="">Tous</div>
        <div class="term-chip ${termFilter === 'court' ? 'active' : ''}" data-term="court"><span class="term-dot term-dot-court"></span>Court terme</div>
        <div class="term-chip ${termFilter === 'moyen' ? 'active' : ''}" data-term="moyen"><span class="term-dot term-dot-moyen"></span>Moyen terme</div>
        <div class="term-chip ${termFilter === 'long' ? 'active' : ''}" data-term="long"><span class="term-dot term-dot-long"></span>Long terme</div>
        <div class="global-stats">
          <span>Durée des actions restantes : <strong>${globalStats.totalDays != null ? globalStats.totalDays + ' j' : '—'}</strong></span>
          <span>Avancement moyen : <strong>${globalStats.avgPct}%</strong></span>
          <span>Actions en retard : <strong>${globalStats.lateCount}</strong></span>
        </div>
      </div>
      <div class="zoom-control">
        ${['quarter', 'month', 'week'].map(z => `<button type="button" class="zoom-btn ${zoom === z ? 'active' : ''}" data-zoom="${z}">${z === 'quarter' ? 'Trimestre' : z === 'month' ? 'Mois' : 'Semaine'}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      ${range ? `<div class="axis"><div class="axis-spacer"></div><div class="axis-track">${axisHtml}</div><div class="axis-pct">Avancement</div></div>` : ''}
      ${pillarBlocksHtml}
    </div>
    ${undatedHtml}
    <div class="footer-note">Vue en lecture seule — généré par ChainPulse.</div>
  `;

  app.querySelectorAll('[data-term]').forEach(el => el.onclick = () => { state.term = el.dataset.term || null; render(); });
  app.querySelectorAll('[data-zoom]').forEach(el => el.onclick = () => { state.zoom = el.dataset.zoom; render(); });
  app.querySelectorAll('[data-pillar-id]').forEach(el => el.onclick = () => {
    const pid = el.dataset.pillarId;
    state.pillarOpen[pid] = state.pillarOpen[pid] === false ? true : false;
    render();
  });
  app.querySelectorAll('[data-action-id]').forEach(el => el.onclick = (e) => {
    const a = DATA.actions.find(x => String(x.id) === el.dataset.actionId);
    if (a) openActionModal(a);
  });
}

main();
</script>
</body>
</html>
